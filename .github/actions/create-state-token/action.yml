name: Create ClawSweeper state token
description: Mint a GitHub App token for the generated state repository.
inputs:
  client-id:
    description: GitHub App client ID.
    required: true
  private-key:
    description: GitHub App private key.
    required: true
  owner:
    description: State repository owner.
    required: false
    default: openclaw
  repository:
    description: State repository name.
    required: false
    default: clawsweeper-state
outputs:
  token:
    description: GitHub App installation token for the state repository.
    value: ${{ steps.state-token.outputs.token }}
runs:
  using: composite
  steps:
    - name: Resolve state repository
      id: state-repository
      shell: bash
      env:
        CONFIGURED_STATE_REPOSITORY: ${{ vars.CLAWSWEEPER_STATE_REPOSITORY }}
        DEFAULT_STATE_OWNER: ${{ inputs.owner }}
        DEFAULT_STATE_REPOSITORY: ${{ inputs.repository }}
      run: |
        set -euo pipefail
        state_repository="${CONFIGURED_STATE_REPOSITORY:-${DEFAULT_STATE_OWNER}/${DEFAULT_STATE_REPOSITORY}}"
        if ! [[ "$state_repository" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
          echo "CLAWSWEEPER_STATE_REPOSITORY must be owner/repository" >&2
          exit 1
        fi
        echo "owner=${state_repository%%/*}" >> "$GITHUB_OUTPUT"
        echo "repository=${state_repository#*/}" >> "$GITHUB_OUTPUT"

    - name: Create state repository token
      id: state-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ steps.state-repository.outputs.owner }}
        repositories: ${{ steps.state-repository.outputs.repository }}
        permission-actions: write
        permission-contents: write
